services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wastewise
      POSTGRES_USER: wastewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wastewise_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastewise -d wastewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wastewise:${POSTGRES_PASSWORD:-wastewise_dev_only}@db:5432/wastewise
      APP_ENV: production
      DEMO_MODE: "false" # disable simulation endpoints in real deployments
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
